[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fox-experiments"
version = "0.1.0"
description = "Readable optimizer and length-generalization experiments for Forgetting Transformers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "tiktoken>=0.7,<1",
    "requests>=2.31,<3",
    "numcodecs>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "build>=1"]
full = ["einops>=0.8,<1", "zarr>=2.18,<3", "huggingface-hub>=0.24,<2", "triton>=3.0,<4; sys_platform == 'linux'"]

[project.scripts]
fox-experiment = "fox_experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fox_experiments.full_training._vendor" = ["*.txt", "*.md", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "third_party|_vendor"
